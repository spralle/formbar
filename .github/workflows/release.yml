name: Publish

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'surikaterna/formbar'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: |
          bun run --filter @formbar/core build:dist
          bun run --filter @formbar/from-schema build:dist
          bun run --filter @formbar/react build:dist
          bun run --filter @formbar/arbiter build:dist
          bun run --filter @formbar/react-schema build:dist

      - name: Version packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight release artifacts
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun scripts/release/plan.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLAN: ${{ runner.temp }}/formbar-release-plan.json

      - name: Publish packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bunx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Reconcile release artifacts
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun scripts/release/apply.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLAN: ${{ runner.temp }}/formbar-release-plan.json
